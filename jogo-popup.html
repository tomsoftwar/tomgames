<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOM GAMES — Jogo</title><link rel="stylesheet" href="assets/css/style.css"><style>html,body{margin:0;min-height:100%;background:#080808;color:#fff;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%;height:100%}body{display:flex;flex-direction:column;align-items:center;padding:14px;box-sizing:border-box}.popup-head{width:min(760px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.popup-head h1{font-size:16px;margin:0;color:#e31b2b}.popup-head button{background:#111;border:2px solid #e31b2b;color:#fff;padding:8px 10px;cursor:pointer;font-weight:700}.popup-wrap{width:min(760px,100%)}canvas{display:block;width:100%;height:auto;border:3px solid #333;image-rendering:pixelated;background:#000}.game-frame{display:block;width:100%;height:720px;border:3px solid #333;background:#000;box-sizing:border-box}.river-frame-wrap{width:min(760px,100%);display:flex;justify-content:center}.mobile-frame-wrap{position:relative;width:min(760px,100%);height:min(720px,calc(100vh - 90px));display:flex;justify-content:center;align-items:flex-start}.mobile-game-frame{width:100%;height:100%;border:3px solid #333;background:#000}.synopsis-lock{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}.synopsis-title{font:22px "Press Start 2P",monospace;color:#e31b2b;margin-bottom:30px}.synopsis-text{max-width:650px;font:700 18px/1.7 monospace;color:#fff}.synopsis-count{margin-top:28px;font:12px monospace;color:#35c76f}.hint{text-align:center;font:11px monospace;color:#aaa;margin:10px 0}.locked{cursor:wait}</style></head><body><div class="popup-head"><h1 id="gameTitle">TOM GAMES</h1><button onclick="window.close()">✕ FECHAR</button></div><div class="popup-wrap" id="gameHost"><canvas id="gameCanvas" width="760" height="480" tabindex="0"></canvas></div><div class="hint" id="hint">SINOPSE • AGUARDE O FINAL DA INTRODUÇÃO</div><script>document.addEventListener('keydown',e=>{if(e.key==='Escape')window.close()});const map={invaders:['invaders','INVADERS'],snake:['snake','COBRINHA'],pacbang:['pacbang','PAC BANG'],joaoMaria:['joaoMaria','JOÃO E MARIA'],racha:['racha','RACHA'],alienFort:['alienFort','ALIEN FORT'],dangerRiver:['dangerRiver','DANGER RIVER'],cityAttack:['cityAttack','CITY ATTACK'],littleJoe:['littleJoe','LITTLE JOE'],megaspace:['megaspace','MEGASPACE'],ninjaShin:['ninjaShin','NINJA SHIN'],pong:['pong','PONG']};const q=new URLSearchParams(location.search).get('game')||'invaders';const [id,title]=map[q]||map.invaders;document.getElementById('gameTitle').textContent='TOM GAMES — '+title;const cv=document.getElementById('gameCanvas');cv.id=id;let introLock=true;function blockDuringIntro(e){if(!introLock)return;if(e.key==='Escape')return;e.preventDefault();e.stopImmediatePropagation();if(e.type==='keydown'||e.type==='keyup')e.stopPropagation();}document.addEventListener('keydown',blockDuringIntro,true);document.addEventListener('keyup',blockDuringIntro,true);document.addEventListener('pointerdown',e=>{if(introLock){e.preventDefault();e.stopImmediatePropagation();}},true);document.addEventListener('pointerup',e=>{if(introLock){e.preventDefault();e.stopImmediatePropagation();}},true);document.addEventListener('click',e=>{if(introLock){e.preventDefault();e.stopImmediatePropagation();}},true);</script><script src="assets/js/games.js"></script><script src="assets/js/games_city_attack.js"></script><script src="assets/js/games_little_joe.js"></script><script src="assets/js/games_megaspace.js"></script><script>
(function(){
  let controller=null;
  if(id==='dangerRiver'){
    const host=document.getElementById('gameHost');
    host.innerHTML='<div class=\"river-frame-wrap\"><iframe class=\"game-frame\" src=\"assets/games/danger-river.html\" title=\"DANGER RIVER\" allow=\"autoplay\" scrolling=\"no\" frameborder=\"0\"></iframe></div>';
    const frame=host.querySelector('iframe'); if(frame){ frame.addEventListener('load',()=>{ try{ const d=frame.contentDocument; d.documentElement.style.overflow='hidden'; d.body.style.overflow='hidden'; d.documentElement.style.overscrollBehavior='none'; d.body.style.overscrollBehavior='none'; d.addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){ e.preventDefault(); }},true); d.addEventListener('keyup',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){ e.preventDefault(); }},true); }catch(e){} }); }introLock=false;
    document.getElementById('hint').textContent='DANGER RIVER V2 • USE O MENU DO JOGO PARA INICIAR';
    return;
  } else if(id==='cityAttack'){
    window.cityAttackGame=new CityAttack(document.getElementById('cityAttack')); controller=window.cityAttackGame; controller.activate();
  } else if(id==='littleJoe'){
    initLittleJoe(document.getElementById('littleJoe')); controller=window.littleJoeGame; controller.activate();
  } else if(id==='megaspace'){
    controller=initMegaSpace(document.getElementById('megaspace')); controller.activate();
  } else if(id==='ninjaShin' || id==='pong'){
    const host=document.getElementById('gameHost');
    const src=id==='ninjaShin'?'assets/games/ninja-shin.html?tomIntro=1':'assets/games/pong.html?tomIntro=1';
    const label=id==='ninjaShin'?'NINJA SHIN':'PONG';
    const synopsis=id==='ninjaShin'?'SHIN É UM NINJA ÁGIL QUE PRECISA DERROTAR INIMIGOS, SUPERAR OBSTÁCULOS E VENCER OS NÍVEIS!':'DOMINE A BOLA, VENÇA SEU ADVERSÁRIO E REVIVA O PONG CLÁSSICO EM ESTILO ATARI 2600!';
    host.innerHTML='<div class=\"mobile-frame-wrap\"><iframe class=\"game-frame mobile-game-frame\" src=\"'+src+'\" title=\"'+label+'\" allow=\"autoplay\" scrolling=\"no\" frameborder=\"0\"></iframe><div id=\"synopsisLock\" class=\"synopsis-lock\"><div class=\"synopsis-title\">'+label+'</div><div class=\"synopsis-text\">'+synopsis+'</div><div class=\"synopsis-count\">O JOGO COMEÇARÁ APÓS A SINOPSE...</div></div></div>';
    introLock=true;
    const frame=host.querySelector('iframe'); const lock=host.querySelector('#synopsisLock');
    setTimeout(()=>{ introLock=false; if(lock) lock.remove(); document.getElementById('hint').textContent='CONTROLES ATIVOS • BOM JOGO!'; try{frame.contentWindow.focus();}catch(e){} },5000);
    return;
  } else {
    switchGame(q); const g=window[{invaders:'invadersGame',snake:'snakeGame',pacbang:'pacBangGame',joaoMaria:'joaoMariaGame',racha:'rachaGame',alienFort:'alienFortGame',dangerRiver:'dangerRiverGame'}[q]]; controller=g; if(g&&typeof g.start==='function')g.start();
  }
  const check=()=>{let intro=false;if(controller){if(typeof controller.isIntro==='function')intro=controller.isIntro();else if(controller.intro===true&&controller.running===false)intro=true;}if(!intro){introLock=false;document.getElementById('hint').textContent='CONTROLES ATIVOS • BOM JOGO!';}else setTimeout(check,50);};check();
  document.getElementById(id).focus();
})();</script></body></html>
