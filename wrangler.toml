name = "tom-games-blog-tecnologia"
main = "worker.js"
compatibility_date = "2026-09-11"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tom-games-blog"
database_id = "COLOQUE_AQUI_O_ID_DO_SEU_BANCO_D1"

[vars]
# Não coloque a chave real aqui. Crie SETUP_KEY como Secret no Cloudflare.
